name: Rust manager CI and release
on:
  pull_request:
    paths:
      - "Rust/**"
      - "Go/**"
      - "Source/install.sh"
      - "Source/update.sh"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "Rust/**"
      - "Go/**"
      - "Source/install.sh"
      - "Source/update.sh"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
concurrency:
  group: manager-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Bash installer syntax
        run: bash -n Source/*.sh
      - run: cargo test --manifest-path Rust/Cargo.toml
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --manifest-path Rust/Cargo.toml --target "${{ matrix.target }}"
      - name: Create checksum and asset
        run: |
          mkdir -p dist
          cp "Rust/target/${{ matrix.target }}/release/pingtunnel" "dist/pingtunnel-manager-linux-${{ matrix.arch }}"
          cd dist
          sha256sum "pingtunnel-manager-linux-${{ matrix.arch }}" > "pingtunnel-manager-linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  go-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Clone pinned upstream Go core
        run: |
          git clone https://github.com/esrrhs/pingtunnel.git upstream
          cd upstream
          git checkout --detach df16e52771ee67f1f9770ec68763b425672a36fc
          test "$(git rev-parse HEAD)" = "df16e52771ee67f1f9770ec68763b425672a36fc"
      - name: Overlay Go crypto and adaptive performance source
        run: |
          cp Go/*.go upstream/
          cp Go/cmd/main.go upstream/cmd/main.go
          cd upstream
          gofmt -w crypto.go auto_crypto.go auto_crypto_test.go adaptive_performance.go adaptive_performance_test.go client.go server.go server_policy.go config.go pairing_v3_test.go secure_session.go secure_session_test.go security_hardening_test.go link_watchdog.go link_watchdog_test.go reverse_icmp.go reverse_icmp_test.go reverse_echo_reflection_test.go reverse_integration_test.go reverse_optimization_test.go reverse_runtime.go pingtunnel.go cmd/main.go
      - name: Run upstream and auto crypto tests
        run: |
          cd upstream
          go test ./...
          go test -race -count=1 ./...
      - name: Verify fail-closed CLI and versioned Go core identity
        run: |
          cd upstream
          go build -o /tmp/pingtunnel-security-verify ./cmd
          test "$(/tmp/pingtunnel-security-verify -security-protocol)" = "pingtunnel-go-core=3.3.2 config-schema=3 wire=4"
          if /tmp/pingtunnel-security-verify -c /tmp/does-not-exist-pingtunnel-config.json; then
            echo "Go core returned success for an invalid config" >&2
            exit 1
          fi
          if /tmp/pingtunnel-security-verify -type server -encrypt auto -encrypt-key invalid; then
            echo "Go core returned success for a missing/invalid pairing" >&2
            exit 1
          fi
      - name: Build static modified Go core
        run: |
          mkdir -p dist
          cd upstream
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build \
            -trimpath -ldflags="-s -w" \
            -o "../dist/pingtunnel-core-linux-${{ matrix.arch }}" ./cmd
          cd ../dist
          sha256sum "pingtunnel-core-linux-${{ matrix.arch }}" > "pingtunnel-core-linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: go-core-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, go-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: go-core-*
          path: dist
          merge-multiple: true
      - name: Build release compatibility manifest
        run: |
          {
            printf 'release=v3.3.2\nconfig_schema=3\nwire=4\n'
            printf 'upstream_go=df16e52771ee67f1f9770ec68763b425672a36fc\n'
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            (cd dist && sha256sum pingtunnel-core-linux-* pingtunnel-manager-linux-* | grep -v '\.sha256') 
          } > dist/release-manifest.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.2
          name: Pingtunnel Manager 3.3.2 — secure wire v4
          prerelease: false
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: false
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-latest
          name: Pingtunnel Manager and Go core (rolling release)
          prerelease: false
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
