name: Rust manager CI and release
on:
  pull_request:
    paths:
      - "Rust/**"
      - "Go/**"
      - "Source/install.sh"
      - "Source/update.sh"
      - "Source/direct_mode_smoke.py"
      - "Source/multi_port_smoke.py"
      - "Source/tests/**"
      - "Upstream/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "Rust/**"
      - "Go/**"
      - "Source/install.sh"
      - "Source/update.sh"
      - "Source/direct_mode_smoke.py"
      - "Source/multi_port_smoke.py"
      - "Source/tests/**"
      - "Upstream/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
concurrency:
  group: manager-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Bash installer syntax
        run: bash -n Source/*.sh
      - name: Verify Release notes migration script syntax
        run: python3 -m py_compile Source/publish_release_history.py
      - name: Rust reproducible dependency and unit tests
        run: cargo test --locked --manifest-path Rust/Cargo.toml
      - name: Verify Auto Tune is not exposed through the CLI
        run: |
          cargo run --locked --quiet --manifest-path Rust/Cargo.toml -- --help > /tmp/pingtunnel-help
          if grep -iq 'auto-tune' /tmp/pingtunnel-help; then
            echo "Auto Tune remains in CLI help" >&2
            exit 1
          fi
          if cargo run --quiet --manifest-path Rust/Cargo.toml -- auto-tune --apply >/tmp/pingtunnel-removed-command.log 2>&1; then
            echo "Removed Auto Tune command unexpectedly accepted" >&2
            exit 1
          fi
          grep -F 'Unknown command: auto-tune' /tmp/pingtunnel-removed-command.log
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --locked --release --manifest-path Rust/Cargo.toml --target "${{ matrix.target }}"
      - name: Create checksum and asset
        run: |
          mkdir -p dist
          cp "Rust/target/${{ matrix.target }}/release/pingtunnel" "dist/pingtunnel-manager-linux-${{ matrix.arch }}"
          cd dist
          sha256sum "pingtunnel-manager-linux-${{ matrix.arch }}" > "pingtunnel-manager-linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  go-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Prepare verified pinned upstream Go source
        run: |
          # The Oct-2026 upstream Git commit was orphaned by an unrelated
          # upstream history rewrite. Keep the exact original Go 1.26 source
          # snapshot in this repository to make every future build stable.
          mkdir upstream
          cp -a Upstream/pingtunnel-df16/. upstream/
          test -f upstream/go.mod
          test -f upstream/LICENSE
          grep -Fxq 'go 1.26.0' upstream/go.mod
      - name: Overlay Go crypto and adaptive performance source
        run: |
          cp Go/*.go upstream/
          cp Go/cmd/main.go upstream/cmd/main.go
          cd upstream
          gofmt -w *.go cmd/main.go
      - name: Run upstream and auto crypto tests
        run: |
          cd upstream
          go mod verify
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...
      - name: Verify fail-closed CLI and versioned Go core identity
        run: |
          cd upstream
          go build -o /tmp/pingtunnel-security-verify ./cmd
          test "$(/tmp/pingtunnel-security-verify -security-protocol)" = "pingtunnel-go-core=3.4.4 config-schema=3 wire=4"
          if /tmp/pingtunnel-security-verify -c /tmp/does-not-exist-pingtunnel-config.json; then
            echo "Go core returned success for an invalid config" >&2
            exit 1
          fi
          if /tmp/pingtunnel-security-verify -type server -encrypt auto -encrypt-key invalid; then
            echo "Go core returned success for a missing/invalid pairing" >&2
            exit 1
          fi
          # Explicitly reject plaintext and legacy client CLI modes even
          # when the operator bypasses the secure Rust manager.
          for mode in none aes128 aes256 chacha20; do
            if output=$(/tmp/pingtunnel-security-verify -type client -l 127.0.0.1:50441 -s 198.51.100.22 -t 127.0.0.1:1 -encrypt "$mode" -encrypt-key invalid 2>&1); then
              echo "Insecure client mode unexpectedly accepted: $mode" >&2
              exit 1
            fi
            printf '%s\n' "$output" | grep -F 'Secure Wire v4 requires -encrypt auto'
          done
          if output=$(/tmp/pingtunnel-security-verify -type client -l 127.0.0.1:50441 -s 198.51.100.22 -t 127.0.0.1:1 2>&1); then
            echo "Missing encryption setting unexpectedly accepted" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'Secure Wire v4 requires -encrypt auto'
      - name: Build static modified Go core
        run: |
          mkdir -p dist
          cd upstream
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build \
            -trimpath -ldflags="-s -w" \
            -o "../dist/pingtunnel-core-linux-${{ matrix.arch }}" ./cmd
          cd ../dist
          sha256sum "pingtunnel-core-linux-${{ matrix.arch }}" > "pingtunnel-core-linux-${{ matrix.arch }}.sha256"
      - name: Concurrent AEAD throughput benchmark (diagnostic, no speed threshold)
        if: matrix.arch == 'amd64'
        run: |
          cd upstream
          go test -run '^$' -bench '^BenchmarkConcurrentSecureAEADEncrypt$' -benchtime=300ms -benchmem -count=1 .
      - name: Real direct ICMP manual/AUTO fault-injection and recovery
        if: matrix.arch == 'amd64'
        timeout-minutes: 8
        run: |
          python3 -m py_compile Source/direct_mode_smoke.py
          sudo python3 Source/direct_mode_smoke.py --binary "$PWD/dist/pingtunnel-core-linux-amd64" --impairment --include-reverse
      - name: Twelve mixed TCP/UDP services over real encrypted ICMP
        if: matrix.arch == 'amd64'
        timeout-minutes: 8
        run: |
          python3 -m py_compile Source/multi_port_smoke.py
          sudo python3 Source/multi_port_smoke.py --binary "$PWD/dist/pingtunnel-core-linux-amd64" --modes direct auto_direct reverse auto --queue-profile tcp
          # Also exercise legacy UDP queue policy with mixed TCP+UDP listeners.
          # Existing sizes, drop policy and scheduling remain untouched.
          sudo python3 Source/multi_port_smoke.py --binary "$PWD/dist/pingtunnel-core-linux-amd64" --modes direct reverse --queue-profile udp
      - name: One-minute sustained mixed TCP/UDP regression
        if: matrix.arch == 'amd64'
        timeout-minutes: 5
        run: |
          sudo python3 Source/multi_port_smoke.py --binary "$PWD/dist/pingtunnel-core-linux-amd64" --modes direct --queue-profile tcp --soak-seconds 60
      - uses: actions/upload-artifact@v4
        with:
          name: go-core-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, go-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether versioned release already exists
        id: version_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.4.4 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: go-core-*
          path: dist
          merge-multiple: true
      - name: Build release compatibility manifest
        run: |
          {
            printf 'release=v3.4.4\nconfig_schema=3\nwire=4\n'
            printf 'upstream_go=df16e52771ee67f1f9770ec68763b425672a36fc\n'
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            (cd dist && sha256sum pingtunnel-core-linux-* pingtunnel-manager-linux-* | grep -v '\.sha256') 
          } > dist/release-manifest.txt
      - uses: softprops/action-gh-release@v2
        if: steps.version_release.outputs.exists == 'false'
        with:
          tag_name: v3.4.4
          name: MSM-Pingtunnel v3.4.4 — Stable
          body_path: docs/RELEASE_NOTES_v3.4.4.md
          prerelease: false
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: false
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-latest
          name: Pingtunnel Manager and Go core (rolling release)
          prerelease: false
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
      # The 30-version notes migration was completed in v3.3.22.
      # No further automated mutation of archived releases is allowed.
