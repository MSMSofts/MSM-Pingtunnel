name: Rust manager CI and release
on:
  pull_request:
    paths:
      - "Rust/**"
      - "Source/install.sh"
      - "Source/update.sh"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "Rust/**"
      - "Source/install.sh"
      - "Source/update.sh"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path Rust/Cargo.toml
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --manifest-path Rust/Cargo.toml --target "${{ matrix.target }}"
      - name: Create checksum and asset
        run: |
          mkdir -p dist
          cp "Rust/target/${{ matrix.target }}/release/pingtunnel" "dist/pingtunnel-manager-linux-${{ matrix.arch }}"
          cd dist
          sha256sum "pingtunnel-manager-linux-${{ matrix.arch }}" > "pingtunnel-manager-linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-linux-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-latest
          name: Rust Manager (rolling release)
          prerelease: false
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
