[package]
name = "pingtunnel-manager"
version = "3.3.12"
edition = "2021"
license = "Apache-2.0"
description = "Lightweight Rust control CLI for the Go Pingtunnel core"

[[bin]]
name = "pingtunnel"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
base64 = "0.22"
rpassword = "7"
sha2 = "0.10"
libc = "0.2"
crossterm = "0.28"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
