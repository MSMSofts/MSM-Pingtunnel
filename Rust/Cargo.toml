[package]
name = "pingtunnel-manager"
version = "2.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Lightweight Rust control CLI for the Go Pingtunnel core"

[[bin]]
name = "pingtunnel"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "io-util", "process", "time", "sync", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
